databaseChangeLog:
  - changeSet:
      id: 003-create-army-preset
      author: felipe

      changes:
        - createTable:
            tableName: army_preset

            columns:
              - column:
                  name: id
                  type: UUID

                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_army_preset

              - column:
                  name: client_id
                  type: VARCHAR(36)

                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(80)

                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(16)

                  constraints:
                    nullable: false

              - column:
                  name: army_payload
                  type: TEXT

                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE

                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE

                  constraints:
                    nullable: false

        - createIndex:
            tableName: army_preset
            indexName: idx_army_preset_client_type_updated

            columns:
              - column:
                  name: client_id

              - column:
                  name: type

              - column:
                  name: updated_at
