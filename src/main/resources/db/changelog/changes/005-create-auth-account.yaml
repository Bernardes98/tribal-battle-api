databaseChangeLog:

  - changeSet:
      id: 005-create-auth-account
      author: tribal-battle
      changes:

        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(254)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: display_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: password_hash
                  type: VARCHAR(60)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - createTable:
            tableName: app_session
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: app_session
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_app_session_user
            onDelete: CASCADE

        - createIndex:
            tableName: app_session
            indexName: idx_app_session_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: app_session
            indexName: idx_app_session_expires_at
            columns:
              - column:
                  name: expires_at
