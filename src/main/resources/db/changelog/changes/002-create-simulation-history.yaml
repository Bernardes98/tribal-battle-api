databaseChangeLog:
  - changeSet:
      id: 002-create-simulation-history
      author: felipe
      changes:
        - createTable:
            tableName: simulation_history
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_simulation_history

              - column:
                  name: client_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false

              - column:
                  name: source
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: result_payload
                  type: TEXT

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - createIndex:
            tableName: simulation_history
            indexName: idx_simulation_history_client_created
            columns:
              - column:
                  name: client_id
              - column:
                  name: created_at
