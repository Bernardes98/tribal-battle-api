databaseChangeLog:
  - changeSet:
      id: 001-create-shared-simulation
      author: felipe
      changes:
        - createTable:
            tableName: shared_simulation
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_shared_simulation
              - column:
                  name: code
                  type: VARCHAR(8)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: shared_simulation
            columnNames: code
            constraintName: uk_shared_simulation_code
