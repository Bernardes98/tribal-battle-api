databaseChangeLog:

  - changeSet:
      id: 010-cloud-backup-versions
      author: tribal-battle
      changes:

        - createTable:
            tableName: user_cloud_state_version
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: revision
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: snapshot_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: archived_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: user_cloud_state_version
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_user_cloud_state_version_user
            onDelete: CASCADE

        - addUniqueConstraint:
            tableName: user_cloud_state_version
            columnNames: user_id, revision
            constraintName: uk_user_cloud_state_version_user_revision

        - createIndex:
            tableName: user_cloud_state_version
            indexName: idx_user_cloud_state_version_user_revision
            columns:
              - column:
                  name: user_id
              - column:
                  name: revision
