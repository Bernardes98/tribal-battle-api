spring:
  datasource:
    url: jdbc:h2:mem:tribal_battle;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: false

  mail:
    host: localhost
    port: 1025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

app:
  frontend-origin: http://localhost:5173
  frontend-origins: http://localhost:5173
  frontend-base-url: http://localhost:5173

  auth:
    session-hours: 168
    password-reset-minutes: 30

  cloud:
    version-retention: 10

  mail:
    from: no-reply@test.local

  http:
    max-request-bytes: 12582912
    trust-forwarded-for: false

  rate-limit:
    enabled: false
    login-per-minute: 1000
    register-per-minute: 1000
    password-reset-per-15-minutes: 1000
    shared-create-per-minute: 1000

management:
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
