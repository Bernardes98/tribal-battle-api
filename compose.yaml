services:
  postgres:
    image: postgres:17-alpine
    container_name: tribal-battle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tribal_battle
      POSTGRES_USER: tribal_battle
      POSTGRES_PASSWORD: tribal_battle
    ports:
      - "5433:5432"
    volumes:
      - tribal_battle_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tribal_battle -d tribal_battle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tribal_battle_postgres_data:
