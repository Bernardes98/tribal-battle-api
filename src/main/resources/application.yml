spring:
  application:
    name: tribal-battle-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/tribal_battle}
    username: ${DB_USERNAME:tribal_battle}
    password: ${DB_PASSWORD:tribal_battle}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
            required: ${SMTP_STARTTLS:false}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  frontend-origins: ${FRONTEND_ORIGINS:${FRONTEND_ORIGIN:http://localhost:5173}}
  frontend-base-url: ${FRONTEND_BASE_URL:${FRONTEND_ORIGIN:http://localhost:5173}}
  auth:
    session-hours: ${AUTH_SESSION_HOURS:168}
    password-reset-minutes: ${PASSWORD_RESET_MINUTES:30}
  cloud:
    version-retention: ${CLOUD_VERSION_RETENTION:10}
  mail:
    from: ${MAIL_FROM:no-reply@localhost}
  http:
    max-request-bytes: ${MAX_REQUEST_BYTES:12582912}
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:10}
    register-per-minute: ${RATE_LIMIT_REGISTER_PER_MINUTE:5}
    password-reset-per-15-minutes: ${RATE_LIMIT_PASSWORD_RESET_PER_15_MINUTES:5}
    shared-create-per-minute: ${RATE_LIMIT_SHARED_CREATE_PER_MINUTE:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: Tribal Battle API
    version: ${APP_VERSION:dev}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
