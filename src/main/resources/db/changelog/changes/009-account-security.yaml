databaseChangeLog:

  - changeSet:
      id: 009-account-security
      author: tribal-battle
      changes:

        - createTable:
            tableName: password_reset_token
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: used_at
                  type: TIMESTAMP WITH TIME ZONE

        - addForeignKeyConstraint:
            baseTableName: password_reset_token
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_password_reset_token_user
            onDelete: CASCADE

        - createIndex:
            tableName: password_reset_token
            indexName: idx_password_reset_token_user_id
            columns:

              - column:
                  name: user_id

        - createIndex:
            tableName: password_reset_token
            indexName: idx_password_reset_token_expires_at
            columns:

              - column:
                  name: expires_at
